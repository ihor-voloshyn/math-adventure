name: Core Domain QA

on:
  pull_request:
    paths:
      - 'core/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/core-domain-qa.yml'
  push:
    branches: [main]
    paths:
      - 'core/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/core-domain-qa.yml'
permissions:
  contents: read
jobs:
  core-tests:
    name: Core Kotlin tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - run: gradle :core:test