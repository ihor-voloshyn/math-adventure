name: Android Prototype

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build and test
        run: gradle assembleDebug test --no-build-cache
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: math-adventure-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

# Triggered for APK validation on main.
