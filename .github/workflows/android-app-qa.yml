name: Android App QA

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'core/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-app-qa.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'core/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-app-qa.yml'

permissions:
  contents: read

jobs:
  android:
    name: Android compile and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - run: gradle :app:test :app:assembleDebug
